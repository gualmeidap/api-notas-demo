<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automação Fiscal - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050b14;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glowing backdrop blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.12;
            z-index: 0;
            animation: float 25s infinite alternate ease-in-out;
        }
        
        .blob-gold {
            background: radial-gradient(circle, #ba8c1a 0%, transparent 70%);
            width: 550px;
            height: 550px;
            top: -10%;
            right: -5%;
            animation-delay: 0s;
        }

        .blob-blue {
            background: radial-gradient(circle, #1e40af 0%, transparent 70%);
            width: 650px;
            height: 650px;
            bottom: -15%;
            left: -10%;
            animation-delay: -7s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(40px, 30px) scale(1.08);
            }
            100% {
                transform: translate(-20px, -40px) scale(0.92);
            }
        }

        /* Glassmorphism styling */
        .glass-card {
            background: rgba(10, 18, 30, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input:focus {
            border-color: #ba8c1a;
            box-shadow: 0 0 16px rgba(186, 140, 26, 0.2);
            background: rgba(255, 255, 255, 0.04);
            color: #f8fafc;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        /* Gold gradient button */
        .gold-btn {
            background: linear-gradient(135deg, #d4af37 0%, #ba8c1a 100%);
            color: #030712;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 18px rgba(186, 140, 26, 0.25);
            font-weight: 700;
        }

        .gold-btn:hover {
            background: linear-gradient(135deg, #f3cf5f 0%, #d4af37 100%);
            box-shadow: 0 6px 22px rgba(186, 140, 26, 0.4);
            transform: translateY(-1.5px);
        }

        .gold-btn:active {
            transform: translateY(0);
        }

        .gold-btn:disabled {
            background: #1f2937;
            color: #6b7280;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Shake animation for error state */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .shake-effect {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-8 relative">

    <!-- Background Blobs -->
    <div class="blob blob-gold"></div>
    <div class="blob blob-blue"></div>

    <!-- Login Glass Card Container -->
    <div class="glass-card rounded-2xl overflow-hidden w-full max-w-[460px] p-8 sm:p-10 relative z-10 flex flex-col">
        
        <!-- Brand Header (Now centered at the top) -->
        <div class="flex flex-col items-center text-center mb-8">
            <div class="relative mb-4">
                <!-- Glowing background behind the shield icon -->
                <div class="absolute inset-0 bg-[#ba8c1a] opacity-20 blur-xl rounded-full scale-75"></div>
                <div style="display:flex;align-items:center;gap:8px;font-size:20px;font-weight:bold;color:var(--primary);"><i data-lucide="file-text"></i> Automação Fiscal</div></i>'">
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight mb-1">Automação Fiscal</h1>
            <p class="text-[10px] font-bold text-[#ba8c1a] tracking-[0.25em] uppercase">Ambiente de Demonstração</p>
        </div>

        <!-- Form Container -->
        <div id="formContainer" class="w-full relative">
            <div class="mb-6 text-center">
                <p class="text-sm text-slate-400">Insira suas credenciais para continuar</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Usuário</label>
                    <div class="relative flex items-center group">
                        <i class="fa-regular fa-user absolute left-4 text-slate-500 group-focus-within:text-[#ba8c1a] transition-colors text-sm"></i>
                        <input type="text" id="username" name="username" required 
                               class="glass-input w-full py-3 pl-11 pr-4 rounded-xl text-slate-200 outline-none text-sm" 
                               placeholder="Digite seu usuário">
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Senha</label>
                    <div class="relative flex items-center group">
                        <i class="fa-solid fa-lock absolute left-4 text-slate-500 group-focus-within:text-[#ba8c1a] transition-colors text-sm"></i>
                        <input type="password" id="password" name="password" required 
                               class="glass-input w-full py-3 pl-11 pr-12 rounded-xl text-slate-200 outline-none text-sm" 
                               placeholder="••••••••">
                        <!-- Toggle Password Button -->
                        <button type="button" onclick="togglePasswordVisibility()" 
                                class="absolute right-4 text-slate-500 hover:text-slate-300 focus:outline-none transition-colors">
                            <i id="passwordToggleIcon" class="fa-regular fa-eye-slash text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Error Message Alert -->
                <div id="error-message" class="hidden text-red-400 bg-red-950/40 border border-[#b91c1c]/50 rounded-xl text-xs font-medium py-3 px-4 flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span id="error-text">Usuário ou senha incorretos.</span>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" id="submitBtn" class="gold-btn w-full py-3.5 rounded-xl flex justify-center items-center gap-2 text-sm">
                        Acessar Painel <i class="fa-solid fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
                    </button>
                </div>
            </form>

            <div class="mt-10 text-center">
                <p class="text-[9px] font-bold text-slate-600 uppercase tracking-[0.3em]">Desenvolvido por Gustavo Pereira</p>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('passwordToggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-regular', 'fa-eye-slash');
                toggleIcon.classList.add('fa-regular', 'fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-regular', 'fa-eye');
                toggleIcon.classList.add('fa-regular', 'fa-eye-slash');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const container = document.getElementById('formContainer');
            const originalBtnContent = 'Acessar Painel <i class="fa-solid fa-arrow-right text-xs"></i>';
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Entrando...';
            errorMsg.classList.add('hidden');
            container.classList.remove('shake-effect');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Success visual cue
                    btn.innerHTML = '<i class="fas fa-check mr-1"></i> Sucesso!';
                    btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                    btn.style.color = '#ffffff';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    errorText.textContent = data.detail || 'Usuário ou senha incorretos.';
                    errorMsg.classList.remove('hidden');
                    
                    // Trigger shake animation
                    void container.offsetWidth; // Trigger reflow
                    container.classList.add('shake-effect');
                    
                    btn.disabled = false;
                    btn.innerHTML = originalBtnContent;
                }
            } catch (err) {
                console.error("Erro ao fazer login:", err);
                errorText.textContent = 'Erro de conexão com o servidor.';
                errorMsg.classList.remove('hidden');
                
                void container.offsetWidth;
                container.classList.add('shake-effect');

                btn.disabled = false;
                btn.innerHTML = originalBtnContent;
            }
        }
    </script>
</body>
</html>
